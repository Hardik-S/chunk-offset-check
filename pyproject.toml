[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunk-offset-check"
version = "0.1.0"
description = "Validate normalized RAG chunk offsets against declared document text."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hardik-S" }]
dependencies = []

[project.scripts]
chunk-offset-check = "chunk_offset_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
